plugins {
    id "com.android.application"
}

android {
    namespace "com.ckf404.pharmacyshortages"
    compileSdk 35

    defaultConfig {
        applicationId "com.ckf404.pharmacyshortages"
        minSdk 24
        targetSdk 35
        versionCode 7
        versionName "1.3.2"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
